<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AURUM — магазин</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast" class="toast" hidden></div>

  <header class="topbar">
    <button class="icon-btn menu-btn" data-open="nav" aria-label="Меню">☰</button>
    <a class="logo" href="#/">AURUM</a>
    <nav class="nav" id="nav">
      <a href="#/">Витрина</a>
      <a href="#/catalog">Каталог</a>
      <a href="#/about">О магазине</a>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="searchToggle" aria-label="Поиск">⌕</button>
      <a class="icon-btn" href="#/account" id="accountLink">Аккаунт</a>
      <a class="icon-btn cart-link" href="#/cart">Корзина <span id="cartCount">0</span></a>
    </div>
  </header>

  <div class="search-bar" id="searchBar" hidden>
    <input id="searchInput" type="search" placeholder="Поиск по названию или категории…" />
  </div>

  <main id="app"></main>

  <footer class="footer">
    <div>
      <strong>AURUM</strong>
      <p>Предметы с характером. Доставка по всей стране.</p>
    </div>
    <div>
      <p>Демо-магазин на GitHub Pages</p>
      <p>Админка: <a href="#/admin">#/admin</a></p>
    </div>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
